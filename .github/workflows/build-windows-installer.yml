name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  build-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for prepare script helpers)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare portable distribution
        shell: pwsh
        run: |
          ./scripts/prepare_portable.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          # Make ISCC available
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Compile installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\VideoClipper.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoClipperSetup
          path: dist/VideoClipperSetup.exe
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VideoClipperSetup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
